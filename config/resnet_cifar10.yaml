seed: 54321

data:
  dataset: cifar10
  train_size: 45000
  val_size: 5000

model:
  name: resnet32
  num_classes: 10

training:
  batch_size: 128
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 1.0e-4
  max_epochs: 200
  lr_milestones: [32000, 48000]
  lr_gamma: 0.1

output:
  dir: runs/resnet_cifar10
